# The live config for both machines. The installers symlink
# ~/.config/keylight/config.toml to this file, so `git pull` updates it.
# Reference for every key: config.example.toml and the README.

[light]
host = "192.168.1.210"          # give the light a DHCP static mapping
kelvin = 4700                   # pinned to the a6000's white balance (ADR 0002)

# [location] is per machine: put it in ~/.config/keylight/local.toml (not in git),
# or set KEYLIGHT_LATITUDE / KEYLIGHT_LONGITUDE. See the README.

[watch]
linux_devices = ["usb-AVerMedia_Live_Streamer_CAP_4K_*-video-index0"]
linux_virtual_devices = ["name:OBS Virtual Camera"]
macos_devices = ["Live Streamer CAP 4K"]
macos_virtual_devices = ["OBS Virtual Camera"]
ignore_processes = ["obs"]      # the Hub's own hold on the card never counts
on_action = "auto"
on_delay = 0.5                  # light on ~0.5-1 s after a call starts
poll_interval = 5.0              # only if change notifications are unavailable (normally pushed)

[obs]
# password: read from OBS's own obs-websocket config on each machine

[auto]
key_side = "left"
# Camera: a6000 + Viltrox 27mm at f/2, ISO 100, 1/60 s (since 2026-11-20). These levels
# assume that exposure: each 1% of light adds ~0.0060 linear Key Side luma (old kit lens: ~0.0037).
night_brightness = 10           # keeps the face level set by eye on 2026-10-29 (old lens at 15%)
day_brightness = 18             # set by eye in OBS at midday, 2026-11-20 (sun 28 deg)
target_luma = 0.263             # night look, set by eye 2026-10-29; a picture value, so the lens doesn't change it
max_stops_under = 0.6           # day look: face 0.67 stop under the wall at the 18% picked by eye
background_roi = [0.65, 0.05, 0.30, 0.45]  # window-side wall, upper right of the frame
