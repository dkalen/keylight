[project]
name = "keylight"
version = "0.2.0"
description = "Elgato Key Light CLI and camera-in-use watcher (local HTTP API)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
keylight = "keylight.cli:main"
keylight-watch = "keylight.watch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["keylight"]
